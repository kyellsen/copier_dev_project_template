_min_copier_version: "9.0.0"
_subdirectory: template
_exclude:
  - "**/.gitkeep"

# ==================== Questions ====================

project_name:
  type: str
  help: "Project name (used for the directory name)"
  default: "my-analysis"

python_module_name:
  type: str
  default: "{{ project_name | replace('-', '_') | lower }}"
  when: false

python_version:
  type: str
  help: "Minimum Python version (e.g., 3.13)"
  default: "3.13"

description:
  type: str
  help: "Short description of the project"
  default: ""

author:
  type: str
  default: "Kyell Jensen"
  when: false

author_email:
  type: str
  default: "mail@kyelljensen.de"
  when: false

# --- What kind of repository is this ---

# The base layer already knows that two writing overlays are built on top of it
# (see include_typst below), so it can ask once what is being built instead of
# asking that same distinction one flag at a time. Only include_vision_roadmap
# hangs off it today; the obvious next candidate is include_precommit, whose
# help text spells out the identical code-vs-text split by hand — see AGENTS.md,
# "Where a gate belongs".
project_kind:
  type: str
  help: "What does this repository produce?"
  choices:
    "Code — a library, a pipeline, an app": "code"
    "Report — a Gutachten (gutachten_bausteine overlay follows)": "report"
    "Thesis — a thesis (thesis_bausteine overlay follows)": "thesis"
  default: "code"

# --- Optional Modules ---

# Generic publication layer: directory skeleton, build tooling and a minimal
# Typst document. Report and thesis specifics are their own overlay templates,
# applied on top of a project generated from here:
#   ~/code/_templates/gutachten_bausteine   (Gutachten)
#   ~/code/_templates/thesis_bausteine     (Thesis)
# Each overlay keeps its own answers file, so both layers update independently.
# Default true: both overlays above write publication/main.typ unconditionally,
# and that imports publication/lib/data.typ, which only this layer provides.
# Answering no here and applying an overlay anyway yields a project that fails
# to compile with "file not found: lib/data.typ" — so the overlays check for it
# in their own `scaffold` and `check-bausteine`. A pure code project without a
# document costs one keystroke; the reverse costs a puzzling Typst error.
include_typst:
  type: bool
  help: "Include Typst publication setup directory? (required by the report and thesis overlays)"
  default: true

include_external_data:
  type: bool
  help: "Connect to external Nextcloud data directories? (adds .env for data paths)"
  default: true

workspace_location_external:
  type: bool
  help: "Store generated intermediate data (Parquet, plots) outside the repo via WORKSPACE_ROOT in .env? (false = internal _workspace/)"
  default: false

# Planning files of a software project: VISION.md carries the why (goal, north
# star), ROADMAP.md the when (milestones). A report and a thesis have neither —
# their goal stands in the commission, their date in the deadline, and both
# belong in the file, not in the repository. So the question is not asked there
# at all: offering planning files to a Gutachten is the question the wrong way
# round, and a "no" that has to be remembered every time is a "yes" waiting to
# happen. The canon lists both files as optional, so a repository without them
# is in order, and no gate looks for them.
include_vision_roadmap:
  type: bool
  help: "Include structured VISION.md and ROADMAP.md files for project planning and AI-agent guidance?"
  default: "{% if project_kind == 'code' %}true{% else %}false{% endif %}"
  when: "{{ project_kind == 'code' }}"

include_license:
  type: bool
  help: "Include LICENSE placeholder file?"
  default: false

# Which canon profiles this project carries. Only used to bootstrap: once
# .agents-canon exists it is authoritative, so changing profiles later is an
# edit there plus 'just canon-pull', not a copier update.
canon_profiles:
  type: str
  help: "Canon profiles (00-core is for everyone; add 10-python, 20-web, 30-ansible, 40-science)"
  default: "00-core,10-python"

# Code repositories: yes. Writing repositories (a report, a thesis): no --
# there the gate belongs at 'just pub-watch' while writing and at delivery,
# not at every save point. See AGENTS.md, "Where a gate belongs".
include_precommit:
  type: bool
  help: "Install a versioned pre-commit hook running 'just check'? (code repos: yes, writing repos: no)"
  default: false

include_github_actions:
  type: bool
  help: "Include GitHub Actions CI workflow?"
  default: false
