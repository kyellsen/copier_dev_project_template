_min_copier_version: "9.0.0"
_subdirectory: template
_exclude:
  - "**/.gitkeep"

# ==================== Questions ====================

project_name:
  type: str
  help: "Project name (used for the directory name)"
  default: "my-analysis"

python_module_name:
  type: str
  default: "{{ project_name | replace('-', '_') | lower }}"
  when: false

python_version:
  type: str
  help: "Minimum Python version (e.g., 3.13)"
  default: "3.13"

description:
  type: str
  help: "Short description of the project"
  default: ""

author:
  type: str
  default: "Kyell Jensen"
  when: false

author_email:
  type: str
  default: "mail@kyelljensen.de"
  when: false

# --- Optional Modules ---

include_latex:
  type: bool
  help: "Include LaTeX / publication setup directory?"
  default: false

include_external_data:
  type: bool
  help: "Connect to external Nextcloud data directories? (adds .env for data paths)"
  default: true

workspace_location:
  type: str
  help: "Where should generated intermediate data (Parquet, DuckDB, plots) be stored?"
  choices:
    "internal  — _workspace/ inside repo (gitignored, zero config)": "internal"
    "external  — outside repo via WORKSPACE_ROOT in .env": "external"
  default: "internal"

workspace_is_internal:
  type: bool
  default: "{% if workspace_location == 'internal' %}true{% else %}false{% endif %}"
  when: false

include_vision_roadmap:
  type: bool
  help: "Include structured VISION.md and ROADMAP.md files for project planning and AI-agent guidance?"
  default: true

include_license:
  type: bool
  help: "Include LICENSE placeholder file?"
  default: false

include_precommit:
  type: bool
  help: "Include local pre-commit hooks delegating to just/uv?"
  default: false

include_github_actions:
  type: bool
  help: "Include GitHub Actions CI workflow?"
  default: false
